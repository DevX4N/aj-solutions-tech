    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts loaded non-render-blocking: preload the stylesheet, then apply it
         asynchronously (media=print → all on load). With display=swap, text
         paints immediately in the fallback stack and swaps in when ready —
         faster First/Largest Contentful Paint on 4G. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!--
      IMPECCABLE DIRECTION CONTRACT — seed: brief-pinned (no roll; user shipped a prescriptive spec)
      THESIS: An agency landing page that proves competence by being the artifact — a precision digital
      engineering studio, not a dark-neon SaaS template. Refuses same-size icon-card grids and eyebrow labels.
      OWN-WORLD: Graphite near-black ground (#08090D), hairline technical/blueprint grids, one committed
      electric-blue accent (#5B8CFF) with a cursor-reactive light field; JetBrains Mono blueprint annotations,
      Bricolage Grotesque editorial display, Hanken Grotesk body. Glow is controlled, never soup.
      STORY: Visitor (SMB/autônomo) understands AJ builds conversion-focused sites, believes it via the page's
      own craft, and acts: Solicitar orçamento / Falar no WhatsApp.
      FIRST VIEWPORT: Oversized editorial headline left, floating instrument-panel browser mockup + light field,
      primary CTA visible above fold, mono proof row beneath.
      FORM: dark editorial-instrument landing, Persuade mode.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
